# OPTIONAL: advanced exporter configuration as a file.
# Most installs only need .env (see .env.example). Use this file for
# host_overrides, password_file, or many pools; mount it at /config/config.yml
# (docker-compose.dev.yml does this). ${VAR} and ${VAR:-default} are
# expanded from the environment.

interval: 30          # seconds between polls of each pool

# Settings applied to every pool unless overridden below
defaults:
  username: root
  verify_ssl: false   # XCP-ng ships self-signed certs; set true if you installed real ones
  timeout: 20

pools:
  # REPLACE with your pool master's management IP or hostname (the XCP-ng host,
  # not XOA). A pool member also works: it redirects to the master.
  # One entry per pool. Every host in the pool is discovered automatically.
  - url: https://POOL-MASTER-IP
    password: ${XEN_POOL1_PASSWORD}   # set XEN_POOL1_PASSWORD in .env
    # name: production      # optional; defaults to the pool name, or the master's host name

  # - url: https://10.0.0.20
  #   name: lab
  #   username: monitoring
  #   password_file: /run/secrets/lab_password
  #   # If the exporter can't reach hosts at the address XAPI reports
  #   # (NAT, separate mgmt network...), map host name or UUID -> address:
  #   host_overrides:
  #     xcp-lab-02: 10.0.0.22
