# xen-mon: all-in-one monitoring for XCP-ng / XenServer pools
#
# This file is all you need. In an empty folder:
#   curl -LO https://raw.githubusercontent.com/mspencerl87/xen-mon/main/docker-compose.yml
#   curl -L -o .env https://raw.githubusercontent.com/mspencerl87/xen-mon/main/.env.example
#   nano .env            # set XEN_POOL1_URL / XEN_POOL1_PASSWORD and a Grafana password
#   docker compose up -d
# Then open http://<this-host>:3000
#
# Images are published to GitHub (ghcr.io) and Docker Hub. To pull from
# Docker Hub instead, set XEN_MON_REGISTRY=docker.io/mspencerl87 in .env.

services:
  exporter:
    image: ${XEN_MON_REGISTRY:-ghcr.io/mspencerl87}/xen-mon-exporter:${XEN_MON_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "9890"

  prometheus:
    image: ${XEN_MON_REGISTRY:-ghcr.io/mspencerl87}/xen-mon-prometheus:${XEN_MON_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - exporter

  grafana:
    image: ${XEN_MON_REGISTRY:-ghcr.io/mspencerl87}/xen-mon-grafana:${XEN_MON_VERSION:-latest}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
