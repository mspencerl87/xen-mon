global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: xen
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["exporter:9890"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
